name: Godot QA
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Godot 4.3
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
      - name: Importar e executar regressão
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/pizza-qa-data
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path godot --quit 2>&1 | tee /tmp/import.log
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --fixed-fps 60 --path godot res://qa/QA.tscn 2>&1 | tee /tmp/qa.log
          python3 godot/qa/check_results.py /tmp/import.log /tmp/qa.log
